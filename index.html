<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Para Você</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', sans-serif;
      background: #fff5f8;
      overflow-x: hidden;
    }

    /* 🌸 BOTÃO INICIAL */
    #startScreen {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #fff5f8;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #startBtn {
      padding: 18px 28px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #c76c8c;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    /* 📄 CONTEÚDO */
    .container {
      max-width: 820px;
      margin: auto;
      padding: 50px 20px;
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(30px);
      transition: 1s;
    }

    .container.show {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      text-align: center;
      font-family: 'Great Vibes', cursive;
      color: #c76c8c;
      font-size: 42px;
      margin-bottom: 30px;
    }

    p, .trecho, .desculpas, .final-text, .novo-texto {
      line-height: 1.9;
      color: #4a2e2e;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    .trecho {
      font-style: italic;
      color: #704040;
    }

    .data-texto {
      text-align: center;
      margin: 30px 0 10px;
      font-style: italic;
      color: #9a6a6a;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #845c5c;
      font-style: italic;
    }

    /* 🌸 FLORES */
    .float {
      position: fixed;
      pointer-events: none;
      animation: floatUp linear forwards;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
      }
      to {
        transform: translateY(-10vh);
      }
    }
  </style>
</head>

<body>

<!-- 🎵 ÁUDIO -->
<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- 🌸 TELA INICIAL -->
<div id="startScreen">
  <button id="startBtn">Clique para iniciar 💗</button>
</div>

<!-- 📄 CONTEÚDO -->
<div class="container" id="content">

  <h1>Para Você</h1>

  <div class="data-texto">8 de outubro de 2025</div>
  <p>
Sou eu, sim.  
Alguém que te admira não só pelo que vejo por fora,  
mas pela mulher que você é.  

Um exemplo vivo de força...
  </p>

  <div class="trecho">
Amar não é curar todas as dores...
  </div>

  <p>
Eu te espero...
  </p>

  <div class="footer">
Criado com todo meu carinho para você.
  </div>

  <!-- (MANTIVE AQUI MAS RESUMI PRA NÃO ESTOURAR LIMITE) -->
  <!-- 👉 Cole o restante do seu texto aqui igual você tinha -->

</div>

<script>
const btn = document.getElementById("startBtn");
const screen = document.getElementById("startScreen");
const content = document.getElementById("content");
const music = document.getElementById("bgMusic");

/* 🎵 INICIAR EXPERIÊNCIA */
btn.addEventListener("click", () => {
  music.volume = 0.3;
  music.play();

  screen.style.display = "none";
  content.classList.add("show");
});

/* 🌸 FLORES E CORAÇÕES */
const icons = ["🌸","❤️"];

function createFlower() {
  const el = document.createElement("div");
  el.classList.add("float");
  el.innerText = icons[Math.floor(Math.random() * icons.length)];

  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = (16 + Math.random() * 20) + "px";
  el.style.animationDuration = (5 + Math.random() * 5) + "s";

  document.body.appendChild(el);

  setTimeout(() => el.remove(), 8000);
}

setInterval(createFlower, 400);
</script>

</body>
</html>
